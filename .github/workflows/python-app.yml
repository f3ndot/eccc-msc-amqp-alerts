name: eccc-msc-amqp-alerts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install Python
        # reads the version pinned in .python-version
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run flake8 src/eccc_msc_amqp_alerts --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uv run flake8 src/eccc_msc_amqp_alerts --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Check types with mypy
        run: uv run mypy src/eccc_msc_amqp_alerts
      - name: Check formatting with black
        run: uv run black --check src/eccc_msc_amqp_alerts tests
      - name: Run tests
        run: uv run pytest
