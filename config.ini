[eccc-msc-amqp-alerts]
# Your name, your company/organization name, or the name of your project, using this
# software. Forms part of the queue name to ECCC's AMQP server. This is courtesy to the
# ECCC in case their analysts need to track down queues in case of problems.
name = justinbull

[bulletins]
enabled = true
# Which types of bulletins to listen to. In the WMO GTS AHL's T1T2 format.
# See https://community.wmo.int/ahl-table-definitions
# do not set to `all` if in webserver
topics = W,X

[alerts]
enabled = true

[webserver]
# Only used when running with -w. The --host and --port flags override these.
# Address to bind to. Use 0.0.0.0 to serve on all network interfaces.
host = 127.0.0.1
# On macOS, port 5000 is usually taken by AirPlay Receiver
port = 5000
