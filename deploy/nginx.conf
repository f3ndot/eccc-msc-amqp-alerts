# Leave this out if another site on the server already defines it
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name weather-alerts.justinbull.ca;

    # Run `certbot --nginx -d <server_name>` to add HTTPS and redirect HTTP to it

    # Debugging endpoints that needn't be public
    location ~ ^/(current_queues|dump)$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # For the page's WebSocket, which it opens at //ws
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Longer than the app's 45s WebSocket heartbeat, or idle visitors get cut off
        proxy_read_timeout 300s;
    }
}
