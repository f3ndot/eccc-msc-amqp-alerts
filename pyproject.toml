[project]
name = "eccc-msc-amqp-alerts"
version = "0.2.0"
description = "Subscribe and listen to Environment and Climate Change Canada's (ECCC) Meteorological Service of Canada (MSC) Datamart AMQP server for timely notification of all and any meteorological alerts and bulletins."
authors = [{ name = "Justin Bull", email = "me@justinbull.ca" }]
requires-python = ">=3.15,<4"
readme = "README.md"
license = "GPL-3.0-or-later" # required due to GTStoWIS2
dependencies = [
    "gtstowis2 @ git+https://github.com/wmo-im/GTStoWIS2.git@a29ec7818c9a65a9bbba30bb59d48859e553ebec",
    "lxml>=6.1.3,<7",
    "quart>=0.20.0,<0.21",
    "httpx[http2]>=0.28.1,<0.29",
    "aio-pika>=10.2.1,<11",
]

[project.urls]
Repository = "https://github.com/f3ndot/eccc-msc-amqp-alerts"

[dependency-groups]
dev = [
    "ipython>=9.18.0,<10",
    "black>=26.10.1,<27",
    "flake8>=7.5.0,<8",
    "mypy>=2.4.1,<3",
    "flake8-bugbear>=26.10.27,<27",
    "lxml-stubs>=0.5.1,<0.6",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-httpserver>=1.2.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run `async def` tests without needing a marker on each one
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
